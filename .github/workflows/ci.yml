name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No install step: the site and its tests have no dependencies.
      - name: Unit, scripted-model and source-check tests
        run: node --test "tests/*.test.mjs"
      # The challenge's own checker: the network, the manifest, and that the generated
      # files (network JSON, bridge, discovery files) match the .hocon source.
      - name: Conformance check
        run: node vendor/agentify-website/scripts/build_network.mjs site/trial_finder.hocon --manifest site/agent-manifest.json --check
      # Task 7 adds check_partner.mjs in both directions.
      # The eval is run by hand with a real key and never runs here.
